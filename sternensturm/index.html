<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Sternensturm – Swimming Lions</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
<meta name="robots" content="noindex, nofollow">
<style>
  @font-face { font-family: "Bricolage Grotesque"; font-weight: 200 800; font-display: swap; src: url(../fonts/bricolage-grotesque.woff2) format("woff2"); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070b1f; color: #fff; font-family: "Bricolage Grotesque", system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid #f6c343; outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* HUD */
  #hud { position: fixed; inset: 0; pointer-events: none; padding: max(10px, env(safe-area-inset-top)) 12px 0; }
  .bar { height: 12px; border-radius: 99px; background: rgba(255,255,255,.14); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; transition: width .12s linear; }
  #hpf { background: linear-gradient(90deg, #ef476f, #ff8fa3); }
  #xpf { background: linear-gradient(90deg, #4cc9f0, #b388ff); }
  .hudrow { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-weight: 800; font-variant-numeric: tabular-nums; text-shadow: 0 1px 3px #000; }
  #pauseBtn { pointer-events: auto; background: rgba(255,255,255,.14); border: 0; border-radius: 10px; min-width: 44px; min-height: 44px; font-size: 1.2rem; }
  #banner { position: fixed; left: 0; right: 0; top: 22%; text-align: center; font-size: clamp(2rem, 9vw, 4rem); font-weight: 800; color: #ff5d73; text-shadow: 0 0 24px #d00000; animation: pulse .5s ease-in-out infinite alternate; pointer-events: none; }
  @keyframes pulse { to { transform: scale(1.07); } }

  /* Bildschirme */
  .screen { position: fixed; inset: 0; display: flex; background: rgba(5,8,25,.9); overflow: auto; padding: max(16px, env(safe-area-inset-top)) 16px 16px; }
  .inner { margin: auto; width: min(760px, 100%); display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
  h1 { margin: 0; font-size: clamp(2.4rem, 10vw, 4.2rem); letter-spacing: -0.02em; line-height: 1; background: linear-gradient(90deg, #4cc9f0, #f6c343, #ff5d73); -webkit-background-clip: text; background-clip: text; color: transparent; }
  h2 { margin: 0; font-size: 1.4rem; }
  p { margin: 0; color: #b8c6e0; line-height: 1.4; }
  .coins { font-weight: 800; font-size: 1.1rem; color: #f6c343; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; width: 100%; }
  .btn { min-height: 52px; padding: 0 26px; border-radius: 14px; border: 0; font-weight: 800; font-size: 1.1rem; background: #f6c343; color: #13315c; box-shadow: 0 3px 0 #b88a14; }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #b88a14; }
  .btn.alt { background: #4cc9f0; box-shadow: 0 3px 0 #1c8fa3; }
  .btn.ghost { background: rgba(255,255,255,.12); color: #fff; box-shadow: none; min-height: 44px; font-size: 1rem; }
  .card { flex: 1 1 160px; max-width: 230px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 14px 12px; border-radius: 16px; border: 2px solid rgba(255,255,255,.16); background: rgba(255,255,255,.07); text-align: center; }
  .card .e { font-size: 2.4rem; line-height: 1.1; }
  .card small { color: #b8c6e0; font-size: .85rem; line-height: 1.3; }
  .card em { font-style: normal; font-weight: 800; font-size: .9rem; color: #f6c343; margin-top: 4px; }
  .hero { border-color: color-mix(in srgb, var(--c) 45%, transparent); }
  .hero.sel { border-color: var(--c); background: color-mix(in srgb, var(--c) 22%, transparent); }
  .hero.lock { opacity: .75; }
  .pips { display: flex; gap: 4px; margin: 2px 0; }
  .pips i { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,.18); }
  .pips i.on { background: #f6c343; }
  .shop { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; width: 100%; }
  .shop .card { max-width: none; }
  .pick { cursor: pointer; border-color: rgba(246,195,67,.55); }
  .pick:hover, .pick:focus-visible { background: rgba(246,195,67,.16); }
  .stat { font-size: 1.05rem; line-height: 1.7; }
  .neu { color: #f6c343; font-weight: 800; }
  .toast { color: #ff8fa3; font-weight: 800; min-height: 1.3em; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" hidden>
  <div class="bar"><i id="hpf"></i></div>
  <div class="bar" style="height:8px;margin-top:5px"><i id="xpf"></i></div>
  <div class="hudrow"><span id="hLv">Lv 1</span><span id="hTime">0:00</span><span id="hKills">☠ 0</span><button id="pauseBtn" aria-label="Pause">⏸</button></div>
</div>
<div id="banner" hidden>⚠ BOSS ⚠</div>

<div class="screen" id="menu">
  <div class="inner">
    <div><a href="../" style="color:#8fb4d9;font-weight:700;text-decoration:none">← Spielesammlung</a></div>
    <h1>Sternensturm</h1>
    <p>Fliege, überlebe und werde mit jeder Runde stärker. Die Waffen schießen von allein – du weichst aus.</p>
    <div class="coins">🪙 <span id="coins">0</span></div>
    <h2>Held wählen</h2>
    <div class="row" id="heroes"></div>
    <div class="row">
      <button class="btn" id="play">▶ Spielen</button>
      <button class="btn alt" id="daily">📅 Tagesrun</button>
    </div>
    <p id="dailyInfo"></p>
    <div class="toast" id="toast"></div>
    <h2>Dauerhafte Upgrades</h2>
    <div class="shop" id="shop"></div>
    <div class="row">
      <button class="btn ghost" id="mute"></button>
      <button class="btn ghost" data-sl-cloud>☁️ Spielstand sichern</button>
    </div>
    <p id="bestInfo"></p>
  </div>
</div>

<div class="screen" id="lvl" hidden>
  <div class="inner">
    <h2>⬆ Level <span id="lvlNum"></span> – wähle ein Upgrade</h2>
    <div class="row" id="picks"></div>
  </div>
</div>

<div class="screen" id="pause" hidden>
  <div class="inner">
    <h2>Pause</h2>
    <div class="row"><button class="btn" id="resume">Weiter</button><button class="btn ghost" id="quit">Aufgeben</button></div>
  </div>
</div>

<div class="screen" id="end" hidden>
  <div class="inner">
    <h1 id="endTitle">Geschafft!</h1>
    <div class="stat" id="endStats"></div>
    <div class="row">
      <button class="btn" id="again">↻ Nochmal</button>
      <button class="btn ghost" id="toMenu">Menü &amp; Shop</button>
    </div>
  </div>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() { DPR = Math.min(2, window.devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; }
addEventListener('resize', resize); resize();

/* ---------- Spielstand ---------- */
const SAVE_KEY = 'ss_save';
const DEF = { coins: 0, heroes: ['nova'], hero: 'nova', up: { hp: 0, dmg: 0, spd: 0, mag: 0 }, best: 0, daily: { day: '', best: 0 }, muted: false, runs: 0 };
let save = (() => {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if (s && typeof s === 'object') return Object.assign({}, DEF, s, { up: Object.assign({}, DEF.up, s.up || {}), daily: Object.assign({}, DEF.daily, s.daily || {}), heroes: Array.isArray(s.heroes) && s.heroes.length ? s.heroes : ['nova'] });
  } catch (e) {}
  return JSON.parse(JSON.stringify(DEF));
})();
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

/* ---------- Zufall & Datum ---------- */
function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
const heute = () => { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };

/* ---------- Daten ---------- */
const HEROES = {
  nova:  { name: 'Nova',  emo: '🚀', col: '#4cc9f0', w: 'bolt',  cost: 0,   hp: 100, spd: 170, txt: 'Feuert automatisch auf den nächsten Gegner.' },
  brumm: { name: 'Brumm', emo: '🛰️', col: '#ffb703', w: 'orbit', cost: 150, hp: 135, spd: 155, txt: 'Kreisende Kugeln – zäh und stark im Getümmel.' },
  zap:   { name: 'Zap',   emo: '⚡', col: '#b388ff', w: 'zap',   cost: 300, hp: 85,  spd: 185, txt: 'Blitze springen von Gegner zu Gegner.' }
};
const WEAPONS = { bolt: { name: 'Plasma-Strahl', emo: '🔹' }, orbit: { name: 'Kreiselkugeln', emo: '🌀' }, zap: { name: 'Kettenblitz', emo: '⚡' }, nova: { name: 'Schockwelle', emo: '💥' } };
const PASS = {
  spd: { name: 'Düsen', emo: '👟', txt: '+10 % Tempo' },
  hp:  { name: 'Panzerung', emo: '🛡️', txt: '+25 Leben und heilt voll' },
  mag: { name: 'Magnet', emo: '🧲', txt: 'Sammelt aus größerer Entfernung' },
  dmg: { name: 'Kraftkern', emo: '🔥', txt: '+12 % Schaden' },
  cd:  { name: 'Turbo', emo: '⏱️', txt: 'Waffen laden 8 % schneller' }
};
const META = {
  hp:  { name: 'Leben',   emo: '❤️', txt: '+12 % Leben je Stufe' },
  dmg: { name: 'Schaden', emo: '🔥', txt: '+8 % Schaden je Stufe' },
  spd: { name: 'Tempo',   emo: '👟', txt: '+5 % Tempo je Stufe' },
  mag: { name: 'Magnet',  emo: '🧲', txt: '+20 % Reichweite je Stufe' }
};
const META_MAX = 6, metaCost = l => 50 + l * 45;
const TYPES = {
  drift: { r: 12, hp: 18,   sp: 58,  dmg: 8,  xp: 1,  col: '#ef476f' },
  swarm: { r: 8,  hp: 9,    sp: 100, dmg: 5,  xp: 1,  col: '#ff9f1c' },
  brute: { r: 21, hp: 100,  sp: 40,  dmg: 16, xp: 6,  col: '#8338ec' },
  boss:  { r: 44, hp: 1400, sp: 48,  dmg: 26, xp: 40, col: '#d00000' }
};
const needXp = l => Math.floor(5 + l * 4 + l * l * 0.5);

/* ---------- Ton ---------- */
let ac = null; const lastSnd = {};
function sfx(name, f, d, type, v, slide) {
  if (save.muted) return;
  const n = performance.now(); if (lastSnd[name] && n - lastSnd[name] < 60) return; lastSnd[name] = n;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    g.gain.setValueAtTime(v || 0.04, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d);
  } catch (e) {}
}

/* ---------- Eingabe ---------- */
const keys = {};
addEventListener('keydown', e => { const k = e.key.toLowerCase(); keys[k] = true; if (k === 'escape' && state === 'play') pauseGame(); if (k.startsWith('arrow') || k === ' ') e.preventDefault(); });
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
const joy = { on: false, id: -1, ox: 0, oy: 0, dx: 0, dy: 0 };
cv.addEventListener('pointerdown', e => { joy.on = true; joy.id = e.pointerId; joy.ox = e.clientX; joy.oy = e.clientY; joy.dx = joy.dy = 0; try { cv.setPointerCapture(e.pointerId); } catch (_) {} });
cv.addEventListener('pointermove', e => {
  if (!joy.on || e.pointerId !== joy.id) return;
  let dx = (e.clientX - joy.ox) / 50, dy = (e.clientY - joy.oy) / 50; const l = Math.hypot(dx, dy);
  if (l > 1) { dx /= l; dy /= l; } joy.dx = dx; joy.dy = dy;
});
const joyEnd = e => { if (e.pointerId === joy.id) { joy.on = false; joy.dx = joy.dy = 0; } };
cv.addEventListener('pointerup', joyEnd); cv.addEventListener('pointercancel', joyEnd);

/* ---------- Lauf ---------- */
let G = null, state = 'menu', pending = 0, last = 0;

function startRun(daily) {
  const h = HEROES[save.hero], seed = daily ? hash(heute()) : (Math.random() * 1e9) | 0;
  G = { daily, rs: rng(seed), ru: rng(seed ^ 0x9e3779b9), t: 0, px: 0, py: 0, inv: 0, xp: 0, lvl: 1, need: needXp(1), kills: 0, bosses: 0,
    w: {}, p: { spd: 0, hp: 0, mag: 0, dmg: 0, cd: 0 }, cd: {}, E: [], S: [], GM: [], FX: [], TX: [], RG: [],
    spawnAcc: 0, nextBoss: 120, orbA: 0, bannerT: 0, flash: 0, shake: 0, hero: save.hero, win: false };
  G.maxhp = Math.round(h.hp * (1 + 0.12 * save.up.hp)); G.hp = G.maxhp;
  G.w[h.w] = 1; pending = 0; joy.on = false; joy.dx = joy.dy = 0;
  for (const k in keys) keys[k] = false;
  ['menu', 'lvl', 'pause', 'end'].forEach(id => $(id).hidden = true);
  $('hud').hidden = false; state = 'play'; last = performance.now();
  sfx('go', 330, .2, 'triangle', .06, 400);
}
const dmgMul = () => (1 + 0.08 * save.up.dmg) * (1 + 0.12 * G.p.dmg);
const speedNow = () => HEROES[G.hero].spd * (1 + 0.05 * save.up.spd) * (1 + 0.1 * G.p.spd);
const magnet = () => 90 * (1 + 0.2 * save.up.mag) * (1 + 0.3 * G.p.mag);
const cdMul = () => Math.pow(0.92, G.p.cd);

function spawnEnemy(type, ang, dist) {
  const g = G, T = TYPES[type];
  const a = ang === undefined ? g.rs() * 6.283 : ang, d = dist || (Math.hypot(W, H) / 2 + 40 + g.rs() * 40);
  let hp = T.hp * (1 + g.t / 75);
  if (type === 'boss') hp = T.hp * (1 + g.bosses * 0.9);
  g.E.push({ t: type, x: g.px + Math.cos(a) * d, y: g.py + Math.sin(a) * d, hp, mhp: hp, r: T.r, kx: 0, ky: 0, fl: 0, oh: -9 });
}
function spawnTick(dt) {
  const g = G; g.spawnAcc += dt * (1.4 + Math.min(g.t, 540) / 22);
  while (g.spawnAcc >= 1) {
    g.spawnAcc--; if (g.E.length >= 330) continue;
    const r = g.rs();
    if (g.t > 35 && r < 0.18) { const a = g.rs() * 6.283; for (let i = 0; i < 5; i++) spawnEnemy('swarm', a + (g.rs() - .5) * .4, Math.hypot(W, H) / 2 + 50 + g.rs() * 30); }
    else if (g.t > 80 && r > 0.9) spawnEnemy('brute');
    else spawnEnemy('drift');
  }
  if (g.t >= g.nextBoss) { g.nextBoss += 120; spawnEnemy('boss'); g.bannerT = 2.2; sfx('boss', 90, .6, 'sawtooth', .08, -30); }
}

function hurtE(e, d, kx, ky) {
  e.hp -= d; e.fl = 0.08; if (kx) { e.kx += kx; e.ky += ky; }
  if (G.TX.length < 40) G.TX.push({ x: e.x, y: e.y - e.r, s: Math.round(d), t: 0.6 });
  sfx('hit', 220 + Math.random() * 60, .05, 'square', .025);
  if (e.hp <= 0 && !e.dead) killE(e);
}
function killE(e) {
  const g = G, T = TYPES[e.t]; e.dead = true; g.kills++;
  if (g.GM.length < 400) g.GM.push({ x: e.x, y: e.y, v: T.xp, h: false });
  else gainXp(T.xp);
  if (e.t !== 'swarm' && g.rs() < 0.02 && g.GM.length < 400) g.GM.push({ x: e.x + 8, y: e.y, v: 0, h: true });
  for (let i = 0; i < (e.t === 'boss' ? 18 : 4); i++) { if (g.FX.length > 150) break; const a = Math.random() * 6.283, s = 40 + Math.random() * 90; g.FX.push({ k: 'p', x: e.x, y: e.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: .4, col: T.col }); }
  if (e.t === 'boss') { g.bosses++; g.hp = Math.min(g.maxhp, g.hp + g.maxhp * 0.3); g.shake = .5; sfx('bossdie', 200, .5, 'sawtooth', .08, -150); }
}
function gainXp(v) {
  const g = G; g.xp += v;
  while (g.xp >= g.need) { g.xp -= g.need; g.lvl++; g.need = needXp(g.lvl); pending++; }
}
function nearest(x, y, maxD, skip) {
  let b = null, bd = maxD * maxD;
  for (const e of G.E) { if (e.dead || (skip && skip.has(e))) continue; const dx = e.x - x, dy = e.y - y, d = dx * dx + dy * dy; if (d < bd) { bd = d; b = e; } }
  return b;
}

/* Waffen */
function weaponsTick(dt) {
  const g = G, dm = dmgMul(), cm = cdMul();
  for (const id in g.w) {
    const L = g.w[id];
    if (id === 'bolt') {
      g.cd.bolt = (g.cd.bolt || 0) - dt;
      if (g.cd.bolt <= 0) {
        const t = nearest(g.px, g.py, 520); if (!t) { g.cd.bolt = .1; continue; }
        g.cd.bolt = (0.85 - 0.07 * L) * cm;
        const n = 1 + (L >= 2) + (L >= 4) + (L >= 5), base = Math.atan2(t.y - g.py, t.x - g.px);
        for (let i = 0; i < n; i++) { const a = base + (i - (n - 1) / 2) * 0.16; g.S.push({ x: g.px, y: g.py, vx: Math.cos(a) * 430, vy: Math.sin(a) * 430, d: (10 + 4 * L) * dm, pierce: 1 + (L >= 3) + (L >= 5), life: 1.3, hit: new Set() }); }
        sfx('bolt', 700, .06, 'square', .02, -300);
      }
    } else if (id === 'orbit') {
      const n = 1 + L, R = 66 + 5 * L; g.orbA += dt * (2.3 + 0.15 * L);
      for (let i = 0; i < n; i++) {
        const a = g.orbA + i * 6.283 / n, ox = g.px + Math.cos(a) * R, oy = g.py + Math.sin(a) * R;
        for (const e of g.E) {
          if (e.dead || g.t - e.oh < 0.35) continue;
          const dx = e.x - ox, dy = e.y - oy; if (dx * dx + dy * dy < (e.r + 12) * (e.r + 12)) { e.oh = g.t; const l = Math.hypot(dx, dy) || 1; hurtE(e, (8 + 3 * L) * dm, dx / l * 60, dy / l * 60); }
        }
      }
    } else if (id === 'zap') {
      g.cd.zap = (g.cd.zap || 0) - dt;
      if (g.cd.zap <= 0) {
        let t = nearest(g.px, g.py, 300); if (!t) { g.cd.zap = .1; continue; }
        g.cd.zap = (1.7 - 0.15 * L) * cm; const hit = new Set(), pts = [{ x: g.px, y: g.py }];
        for (let i = 0; i < 2 + L && t; i++) { hit.add(t); pts.push({ x: t.x, y: t.y }); hurtE(t, (14 + 5 * L) * dm); t = nearest(t.x, t.y, 150, hit); }
        g.FX.push({ k: 'l', pts, t: .15 }); sfx('zap', 900, .1, 'sawtooth', .025, -600);
      }
    } else if (id === 'nova') {
      g.cd.nova = (g.cd.nova || 0) - dt;
      if (g.cd.nova <= 0) { g.cd.nova = (3.4 - 0.3 * L) * cm; g.RG.push({ r: 0, max: 110 + 20 * L, d: (20 + 8 * L) * dm, hit: new Set() }); sfx('nova', 160, .25, 'triangle', .06, -80); }
    }
  }
  for (const r of g.RG) {
    r.r += 520 * dt;
    for (const e of g.E) { if (e.dead || r.hit.has(e)) continue; const dx = e.x - g.px, dy = e.y - g.py, d = Math.hypot(dx, dy); if (d < r.r + e.r) { r.hit.add(e); hurtE(e, r.d, dx / (d || 1) * 220, dy / (d || 1) * 220); } }
  }
  g.RG = g.RG.filter(r => r.r < r.max);
}

function update(dt) {
  const g = G; g.t += dt;
  let mx = 0, my = 0;
  if (keys.arrowleft || keys.a) mx--; if (keys.arrowright || keys.d) mx++; if (keys.arrowup || keys.w) my--; if (keys.arrowdown || keys.s) my++;
  if (joy.on) { mx = joy.dx; my = joy.dy; }
  const l = Math.hypot(mx, my); if (l > 1) { mx /= l; my /= l; }
  const sp = speedNow(); g.px += mx * sp * dt; g.py += my * sp * dt;
  g.inv = Math.max(0, g.inv - dt); g.flash = Math.max(0, g.flash - dt); g.shake = Math.max(0, g.shake - dt); g.bannerT = Math.max(0, g.bannerT - dt);

  spawnTick(dt); weaponsTick(dt);

  // Gegner
  for (const e of g.E) {
    if (e.dead) continue; const T = TYPES[e.t];
    const dx = g.px - e.x, dy = g.py - e.y, d = Math.hypot(dx, dy) || 1;
    e.x += (dx / d * T.sp + e.kx) * dt; e.y += (dy / d * T.sp + e.ky) * dt;
    e.kx *= Math.pow(.02, dt); e.ky *= Math.pow(.02, dt); e.fl = Math.max(0, e.fl - dt);
    if (d > 900) { e.x = g.px - dx / d * 400; e.y = g.py - dy / d * 400; }
    if (d < e.r + 13 && g.inv <= 0) { g.hp -= T.dmg; g.inv = 0.5; g.flash = .18; g.shake = .15; sfx('ouch', 120, .15, 'sawtooth', .07, -60); }
  }
  // Schüsse
  for (const s of g.S) {
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    for (const e of g.E) {
      if (e.dead || s.hit.has(e)) continue; const dx = e.x - s.x, dy = e.y - s.y;
      if (dx * dx + dy * dy < (e.r + 5) * (e.r + 5)) { s.hit.add(e); hurtE(e, s.d, s.vx * .1, s.vy * .1); if (--s.pierce < 0) { s.life = 0; break; } }
    }
  }
  g.S = g.S.filter(s => s.life > 0);
  g.E = g.E.filter(e => !e.dead);
  // Edelsteine
  const mg = magnet();
  for (const m of g.GM) {
    const dx = g.px - m.x, dy = g.py - m.y, d = Math.hypot(dx, dy);
    if (d < mg || m.fly) { m.fly = true; const s = 260 + (mg - Math.min(d, mg)) * 2; m.x += dx / (d || 1) * s * dt; m.y += dy / (d || 1) * s * dt; }
    if (d < 16) { m.got = true; if (m.h) { g.hp = Math.min(g.maxhp, g.hp + g.maxhp * 0.2); sfx('heal', 500, .15, 'sine', .05, 400); } else { gainXp(m.v); sfx('gem', 900 + Math.min(g.lvl, 20) * 15, .05, 'sine', .03); } }
  }
  g.GM = g.GM.filter(m => !m.got);
  // Effekte
  for (const f of g.FX) { f.t -= dt; if (f.k === 'p') { f.x += f.vx * dt; f.y += f.vy * dt; } }
  g.FX = g.FX.filter(f => f.t > 0);
  for (const t of g.TX) { t.t -= dt; t.y -= 30 * dt; }
  g.TX = g.TX.filter(t => t.t > 0);

  if (g.hp <= 0) return finish(false);
  if (g.t >= 600) return finish(true);
  if (pending > 0) openLevel();
}

/* Level-up */
function openLevel() {
  const g = G, pool = [];
  for (const id in WEAPONS) { const L = g.w[id] || 0; if (L < 5) pool.push({ k: 'w', id, L: L + 1, name: (L ? '' : 'NEU: ') + WEAPONS[id].name + (L ? ' · Stufe ' + (L + 1) : ''), emo: WEAPONS[id].emo, txt: L ? 'Stärker, öfter, mehr' : 'Neue Waffe, schießt automatisch' }); }
  for (const id in PASS) { const L = g.p[id]; if (L < 5) pool.push({ k: 'p', id, name: PASS[id].name + ' · Stufe ' + (L + 1), emo: PASS[id].emo, txt: PASS[id].txt }); }
  if (!pool.length) pool.push({ k: 'h', name: 'Reparatur', emo: '🩹', txt: 'Heilt dich voll' });
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(g.ru() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  const box = $('picks'); box.innerHTML = '';
  pool.slice(0, 3).forEach(o => {
    const b = document.createElement('button'); b.className = 'card pick';
    b.innerHTML = '<span class="e">' + o.emo + '</span><b' + (o.name.startsWith('NEU') ? ' class="neu"' : '') + '>' + o.name + '</b><small>' + o.txt + '</small>';
    b.onclick = () => {
      if (o.k === 'w') g.w[o.id] = o.L;
      else if (o.k === 'p') { g.p[o.id]++; if (o.id === 'hp') { g.maxhp += 25; g.hp = g.maxhp; } }
      else g.hp = g.maxhp;
      sfx('up', 500, .2, 'triangle', .06, 500);
      pending--; $('lvl').hidden = true;
      if (pending > 0) openLevel(); else { state = 'play'; last = performance.now(); }
    };
    box.appendChild(b);
  });
  $('lvlNum').textContent = g.lvl - pending + 1;
  state = 'lvl'; $('lvl').hidden = false; joy.on = false; joy.dx = joy.dy = 0;
}

function finish(win) {
  const g = G; g.win = win; state = 'end'; $('hud').hidden = true; $('banner').hidden = true;
  const score = g.kills * 10 + Math.floor(g.t) * 3 + g.bosses * 500 + (win ? 3000 : 0);
  let coins = Math.floor(g.kills / 8 + g.t / 6 + g.bosses * 25 + (win ? 100 : 0)), bonus = 0;
  const day = heute();
  if (g.daily && save.daily.day !== day) { bonus = 40; coins += bonus; }
  let dBest = false;
  if (g.daily) { if (save.daily.day !== day) save.daily = { day, best: 0 }; if (score > save.daily.best) { save.daily.best = score; dBest = true; } }
  const newBest = score > save.best; if (newBest) save.best = score;
  save.coins += coins; save.runs++; persist();
  const m = Math.floor(g.t / 60), s = String(Math.floor(g.t % 60)).padStart(2, '0');
  $('endTitle').textContent = win ? '🏆 Überlebt!' : 'Zerstört!';
  $('endStats').innerHTML = '<b style="font-size:2rem">' + score.toLocaleString('de-DE') + ' Punkte</b><br>' +
    (newBest ? '<span class="neu">Neuer Rekord!</span><br>' : (dBest ? '<span class="neu">Neuer Tages-Bestwert!</span><br>' : 'Rekord: ' + save.best.toLocaleString('de-DE') + '<br>')) +
    '⏱ ' + m + ':' + s + ' · ☠ ' + g.kills + ' · 👾 Bosse ' + g.bosses + '<br>' +
    '<span class="coins">+ ' + coins + ' 🪙</span>' + (bonus ? ' (inkl. ' + bonus + ' Tagesbonus)' : '') + '<br><small>Du hast jetzt ' + save.coins + ' 🪙 – hol dir im Menü ein Upgrade.</small>';
  $('end').hidden = false;
  sfx('end', win ? 600 : 200, .5, 'triangle', .07, win ? 500 : -120);
}

/* ---------- Zeichnen ---------- */
function draw() {
  const g = G; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#070b1f'; ctx.fillRect(0, 0, W, H);
  if (!g) return;
  const sh = g.shake > 0 ? (Math.random() - .5) * 10 * g.shake * 2 : 0;
  const cx = g.px - W / 2 + sh, cy = g.py - H / 2 + sh;
  // Sterne
  const C = 90; ctx.fillStyle = '#cfe8ff';
  for (let i = Math.floor(cx / C); i <= Math.floor((cx + W) / C); i++) for (let j = Math.floor(cy / C); j <= Math.floor((cy + H) / C); j++) {
    let h = Math.imul(i, 73856093) ^ Math.imul(j, 19349663); h = Math.imul(h ^ h >>> 13, 1274126177); h ^= h >>> 16;
    if ((h & 3) === 0) continue;
    ctx.globalAlpha = 0.25 + ((h >>> 4) & 7) / 12; ctx.fillRect(i * C + ((h >>> 8) & 63) - cx, j * C + ((h >>> 14) & 63) - cy, 1 + ((h >>> 20) & 1), 1 + ((h >>> 20) & 1));
  }
  ctx.globalAlpha = 1; ctx.translate(-cx, -cy);

  for (const m of g.GM) { ctx.fillStyle = m.h ? '#ff5d73' : '#4cc9f0'; ctx.beginPath(); if (m.h) ctx.arc(m.x, m.y, 6, 0, 6.283); else { ctx.moveTo(m.x, m.y - 6); ctx.lineTo(m.x + 4, m.y); ctx.lineTo(m.x, m.y + 6); ctx.lineTo(m.x - 4, m.y); } ctx.fill(); }
  for (const e of g.E) {
    const T = TYPES[e.t]; ctx.fillStyle = e.fl > 0 ? '#fff' : T.col;
    ctx.beginPath();
    if (e.t === 'swarm') { const a = Math.atan2(g.py - e.y, g.px - e.x); ctx.moveTo(e.x + Math.cos(a) * 10, e.y + Math.sin(a) * 10); ctx.lineTo(e.x + Math.cos(a + 2.5) * 9, e.y + Math.sin(a + 2.5) * 9); ctx.lineTo(e.x + Math.cos(a - 2.5) * 9, e.y + Math.sin(a - 2.5) * 9); }
    else if (e.t === 'brute') { for (let k = 0; k < 6; k++) ctx.lineTo(e.x + Math.cos(k * 1.047) * e.r, e.y + Math.sin(k * 1.047) * e.r); }
    else ctx.arc(e.x, e.y, e.r, 0, 6.283);
    ctx.fill();
    if (e.t !== 'swarm') { ctx.fillStyle = '#fff'; const ex = e.r * .35; ctx.beginPath(); ctx.arc(e.x - ex, e.y - 2, e.r * .2, 0, 6.283); ctx.arc(e.x + ex, e.y - 2, e.r * .2, 0, 6.283); ctx.fill(); ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(e.x - ex, e.y - 2, e.r * .09, 0, 6.283); ctx.arc(e.x + ex, e.y - 2, e.r * .09, 0, 6.283); ctx.fill(); }
    if (e.t === 'boss' || e.t === 'brute') { ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(e.x - e.r, e.y - e.r - 10, e.r * 2, 5); ctx.fillStyle = '#ff5d73'; ctx.fillRect(e.x - e.r, e.y - e.r - 10, e.r * 2 * Math.max(0, e.hp / e.mhp), 5); }
  }
  ctx.fillStyle = '#9ef0ff'; for (const s of g.S) { ctx.beginPath(); ctx.arc(s.x, s.y, 4, 0, 6.283); ctx.fill(); }
  if (g.w.orbit) { const n = 1 + g.w.orbit, R = 66 + 5 * g.w.orbit; ctx.fillStyle = '#ffd166'; for (let i = 0; i < n; i++) { const a = g.orbA + i * 6.283 / n; ctx.beginPath(); ctx.arc(g.px + Math.cos(a) * R, g.py + Math.sin(a) * R, 10, 0, 6.283); ctx.fill(); } }
  for (const r of g.RG) { ctx.strokeStyle = 'rgba(179,136,255,' + (1 - r.r / r.max) + ')'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(g.px, g.py, r.r, 0, 6.283); ctx.stroke(); }
  for (const f of g.FX) {
    if (f.k === 'l') { ctx.strokeStyle = '#e0c3ff'; ctx.lineWidth = 3; ctx.beginPath(); f.pts.forEach((p, i) => i ? ctx.lineTo(p.x + (Math.random() - .5) * 8, p.y + (Math.random() - .5) * 8) : ctx.moveTo(p.x, p.y)); ctx.stroke(); }
    else { ctx.globalAlpha = Math.max(0, f.t / .4); ctx.fillStyle = f.col; ctx.fillRect(f.x - 2, f.y - 2, 4, 4); ctx.globalAlpha = 1; }
  }
  // Spieler
  const h = HEROES[g.hero]; ctx.globalAlpha = g.inv > 0 && Math.floor(g.t * 20) % 2 ? .4 : 1;
  ctx.fillStyle = h.col; ctx.beginPath(); ctx.arc(g.px, g.py, 15, 0, 6.283); ctx.fill();
  ctx.font = '20px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff'; ctx.fillText(h.emo, g.px, g.py + 1); ctx.globalAlpha = 1;
  ctx.font = '800 14px "Bricolage Grotesque", sans-serif'; ctx.fillStyle = '#fff';
  for (const t of g.TX) { ctx.globalAlpha = Math.min(1, t.t * 3); ctx.fillText(t.s, t.x, t.y); } ctx.globalAlpha = 1;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (g.flash > 0) { ctx.fillStyle = 'rgba(255,60,80,' + g.flash * 1.6 + ')'; ctx.fillRect(0, 0, W, H); }
  if (joy.on) { ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(joy.ox, joy.oy, 50, 0, 6.283); ctx.stroke(); ctx.fillStyle = 'rgba(255,255,255,.4)'; ctx.beginPath(); ctx.arc(joy.ox + joy.dx * 50, joy.oy + joy.dy * 50, 20, 0, 6.283); ctx.fill(); }
}
function hud() {
  const g = G; $('hpf').style.width = Math.max(0, g.hp / g.maxhp * 100) + '%'; $('xpf').style.width = (g.xp / g.need * 100) + '%';
  $('hLv').textContent = 'Lv ' + g.lvl; $('hTime').textContent = Math.floor(g.t / 60) + ':' + String(Math.floor(g.t % 60)).padStart(2, '0'); $('hKills').textContent = '☠ ' + g.kills;
  $('banner').hidden = g.bannerT <= 0;
}

function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state === 'play') { update(dt); if (state === 'play') hud(); }
  if (G && state !== 'menu') draw(); else { ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.fillStyle = '#070b1f'; ctx.fillRect(0, 0, W, H); }
}

/* ---------- Menü ---------- */
function pauseGame() { if (state !== 'play') return; state = 'pause'; $('pause').hidden = false; }
$('pauseBtn').onclick = pauseGame;
$('resume').onclick = () => { $('pause').hidden = true; state = 'play'; last = performance.now(); };
$('quit').onclick = () => { $('pause').hidden = true; finish(false); };
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
$('again').onclick = () => startRun(G && G.daily && save.daily.day !== heute() ? false : !!(G && G.daily));
$('toMenu').onclick = () => { $('end').hidden = true; state = 'menu'; G = null; renderMenu(); $('menu').hidden = false; };
$('play').onclick = () => startRun(false);
$('daily').onclick = () => startRun(true);
$('mute').onclick = () => { save.muted = !save.muted; persist(); renderMenu(); };

let toastT = 0;
function toast(t) { $('toast').textContent = t; clearTimeout(toastT); toastT = setTimeout(() => $('toast').textContent = '', 2200); }

function renderMenu() {
  $('coins').textContent = save.coins;
  const hb = $('heroes'); hb.innerHTML = '';
  for (const id in HEROES) {
    const h = HEROES[id], own = save.heroes.includes(id), b = document.createElement('button');
    b.className = 'card hero' + (save.hero === id ? ' sel' : '') + (own ? '' : ' lock'); b.style.setProperty('--c', h.col);
    b.innerHTML = '<span class="e">' + h.emo + '</span><b>' + h.name + '</b><small>' + h.txt + '</small><em>' + (own ? (save.hero === id ? '✔ Ausgewählt' : 'Wählen') : '🔒 ' + h.cost + ' 🪙') + '</em>';
    b.onclick = () => {
      if (own) save.hero = id;
      else if (save.coins >= h.cost) { save.coins -= h.cost; save.heroes.push(id); save.hero = id; sfx('buy', 600, .2, 'triangle', .06, 500); }
      else { toast('Noch ' + (h.cost - save.coins) + ' 🪙 bis ' + h.name + '. Spiel eine Runde!'); return; }
      persist(); renderMenu();
    };
    hb.appendChild(b);
  }
  const sb = $('shop'); sb.innerHTML = '';
  for (const id in META) {
    const m = META[id], L = save.up[id], max = L >= META_MAX, cost = metaCost(L), b = document.createElement('button');
    b.className = 'card';
    b.innerHTML = '<span class="e">' + m.emo + '</span><b>' + m.name + '</b><small>' + m.txt + '</small><div class="pips">' + Array.from({ length: META_MAX }, (_, i) => '<i class="' + (i < L ? 'on' : '') + '"></i>').join('') + '</div><em>' + (max ? 'MAX' : cost + ' 🪙') + '</em>';
    b.onclick = () => {
      if (max) return;
      if (save.coins < cost) { toast('Noch ' + (cost - save.coins) + ' 🪙 für ' + m.name + '.'); return; }
      save.coins -= cost; save.up[id]++; persist(); sfx('buy', 600, .2, 'triangle', .06, 500); renderMenu();
    };
    sb.appendChild(b);
  }
  const d = save.daily.day === heute();
  $('dailyInfo').textContent = d ? 'Tagesrun heute: Bestwert ' + save.daily.best.toLocaleString('de-DE') + ' – gleiche Welle & Upgrades für alle.' : 'Tagesrun: heute noch nicht gespielt – +40 🪙 Bonus beim ersten Mal!';
  $('bestInfo').textContent = save.best ? 'Dein Rekord: ' + save.best.toLocaleString('de-DE') + ' Punkte · ' + save.runs + ' Runden' : 'Überlebe 10 Minuten für den Sieg. Alle 2 Minuten kommt ein Boss.';
  $('mute').textContent = save.muted ? '🔇 Ton aus' : '🔊 Ton an';
}
renderMenu();

/* ---------- Rangliste ---------- */
window.SLRangAdapter = () => {
  const ups = Object.values(save.up).reduce((a, b) => a + b, 0);
  return { punkte: save.best, progress: Math.min(100, Math.round((save.heroes.length - 1) / 2 * 40 + ups / (4 * META_MAX) * 60)) };
};
requestAnimationFrame(t => { last = t; loop(t); });
</script>
<script src="https://rangliste-aoee.onrender.com/melder.js" data-spiel="Sternensturm" data-speicher="ss_" defer></script>
</body>
