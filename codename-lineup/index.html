<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Codename: Lineup – Swimming Lions</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕶️</text></svg>">
<meta name="robots" content="noindex, nofollow">
<style>

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #111; color: #111; font-family: "Bricolage Grotesque", system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 4px solid #2f7bf6; outline-offset: 2px; }
  [hidden] { display: none !important; }
  .comic { font-weight: 800; font-style: italic; letter-spacing: .01em; -webkit-text-stroke: 2px #111; paint-order: stroke fill; }

  /* HUD */
  #hud { position: fixed; inset: 0; pointer-events: none; padding: max(10px, env(safe-area-inset-top)) 12px 0; }
  .bar { height: 18px; border: 3px solid #111; border-radius: 6px; background: #fff; overflow: hidden; box-shadow: 3px 3px 0 #111; }
  .bar i { display: block; height: 100%; width: 0; transition: width .12s linear; }
  #hpf { background: repeating-linear-gradient(-45deg, #ff3b3b 0 10px, #e02020 10px 20px); }
  #xpf { background: repeating-linear-gradient(-45deg, #2fb8ff 0 10px, #1a8fe0 10px 20px); }
  .hudrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; }
  .chip { background: #fff; border: 3px solid #111; border-radius: 8px; padding: 2px 10px; font-weight: 800; box-shadow: 3px 3px 0 #111; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #pauseBtn { pointer-events: auto; background: #ffd23f; border: 3px solid #111; border-radius: 10px; min-width: 46px; min-height: 46px; font-size: 1.2rem; font-weight: 800; box-shadow: 3px 3px 0 #111; }
  #ultBtn { position: fixed; right: max(18px, env(safe-area-inset-right)); bottom: max(18px, env(safe-area-inset-bottom)); width: 92px; height: 92px; border-radius: 50%; border: 4px solid #111; pointer-events: auto; font-weight: 800; font-size: 1.05rem; color: #fff; box-shadow: 4px 4px 0 #111; background: conic-gradient(#ff3b3b var(--p, 0%), #555 0); }
  #ultBtn span { display: grid; place-items: center; position: absolute; inset: 9px; border-radius: 50%; background: #222; border: 3px solid #111; }
  #ultBtn.voll span { background: #ff3b3b; animation: puls .5s ease-in-out infinite alternate; }
  @keyframes puls { to { transform: scale(1.08); } }
  #banner { position: fixed; left: 0; right: 0; top: 20%; text-align: center; font-size: clamp(2rem, 9vw, 4.2rem); color: #ffd23f; text-shadow: 5px 5px 0 #111; pointer-events: none; padding: 0 12px; animation: pop .35s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { from { transform: scale(.3) rotate(-8deg); } }

  /* Ulti-Einblendung */
  #cutin { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  #cutin .band { position: absolute; left: -10%; right: -10%; top: 30%; height: 40%; transform: skewY(-6deg); background: radial-gradient(circle, rgba(0,0,0,.22) 2px, transparent 2.6px) 0 0/12px 12px, linear-gradient(90deg, var(--c1), var(--c2)); border-top: 6px solid #111; border-bottom: 6px solid #111; animation: band .9s cubic-bezier(.2,.9,.3,1) both; display: flex; align-items: center; justify-content: center; gap: 4vw; }
  #cutin img { height: 150%; image-rendering: auto; filter: drop-shadow(6px 6px 0 #111); transform: skewY(6deg); animation: rein .9s cubic-bezier(.2,.9,.3,1) both; }
  #cutin .txt { transform: skewY(6deg); color: #fff; text-align: left; }
  #cutin .txt b { display: block; font-size: clamp(2.2rem, 8vw, 5rem); line-height: 1; font-style: italic; -webkit-text-stroke: 3px #111; paint-order: stroke fill; text-shadow: 5px 5px 0 #111; }
  #cutin .txt span { font-size: clamp(1rem, 3.5vw, 1.6rem); font-weight: 800; color: #ffd23f; -webkit-text-stroke: 2px #111; paint-order: stroke fill; }
  @keyframes band { 0% { transform: skewY(-6deg) translateX(-110%); } 18%, 82% { transform: skewY(-6deg) translateX(0); } 100% { transform: skewY(-6deg) translateX(110%); } }
  @keyframes rein { 0% { transform: skewY(6deg) translateX(-60vw) scale(.6); } 25%, 85% { transform: skewY(6deg) translateX(0) scale(1); } 100% { transform: skewY(6deg) translateX(40vw); } }

  /* Bildschirme */
  .screen { position: fixed; inset: 0; display: flex; overflow: auto; padding: max(16px, env(safe-area-inset-top)) 16px 24px; background: radial-gradient(circle, rgba(0,0,0,.16) 2px, transparent 2.6px) 0 0/14px 14px, linear-gradient(135deg, #ffd23f 0%, #ff8a3d 55%, #ff3b6b 100%); }
  #lvl, #chest, #pause, #end { background: radial-gradient(circle, rgba(0,0,0,.25) 2px, transparent 2.6px) 0 0/14px 14px, rgba(20,20,30,.82); }
  .inner { margin: auto; width: min(860px, 100%); display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
  h1 { margin: 0; font-size: clamp(2.6rem, 11vw, 5.2rem); line-height: .95; color: #fff; font-style: italic; -webkit-text-stroke: 3px #111; paint-order: stroke fill; text-shadow: 6px 6px 0 #111; transform: rotate(-2deg); }
  h1 small { display: block; font-size: .38em; color: #ffd23f; letter-spacing: .1em; }
  h2 { margin: 6px 0 0; font-size: 1.5rem; font-style: italic; color: #fff; -webkit-text-stroke: 2px #111; paint-order: stroke fill; text-shadow: 3px 3px 0 #111; }
  p { margin: 0; line-height: 1.4; }
  .panel { background: #fff; border: 4px solid #111; border-radius: 14px; box-shadow: 6px 6px 0 #111; padding: 14px 16px; width: 100%; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; width: 100%; }
  .btn { min-height: 56px; padding: 0 28px; border-radius: 12px; border: 4px solid #111; font-weight: 800; font-style: italic; font-size: 1.25rem; background: #ff3b3b; color: #fff; box-shadow: 5px 5px 0 #111; -webkit-text-stroke: 1.5px #111; paint-order: stroke fill; }
  .btn:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 #111; }
  .btn.alt { background: #2fb8ff; }
  .btn.ghost { background: #fff; color: #111; -webkit-text-stroke: 0; min-height: 46px; font-size: 1rem; }
  .agenten { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; width: 100%; }
  .agent { position: relative; padding: 6px 4px 8px; border: 4px solid #111; border-radius: 12px; background: var(--c); box-shadow: 4px 4px 0 #111; display: flex; flex-direction: column; align-items: center; gap: 2px; font-weight: 800; color: #fff; -webkit-text-stroke: 1.5px #111; paint-order: stroke fill; }
  .agent img { width: 72px; height: 72px; background: radial-gradient(circle, rgba(255,255,255,.35) 2px, transparent 2.6px) 0 0/8px 8px; border-radius: 8px; }
  .agent.sel { transform: translateY(-4px) rotate(-2deg); outline: 4px solid #fff; outline-offset: -10px; }
  .agent.lock img { filter: brightness(0) opacity(.55); }
  .agent small { font-size: .78rem; -webkit-text-stroke: 0; color: #111; background: #fff; border: 2px solid #111; border-radius: 6px; padding: 0 5px; }
  .info { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; text-align: left; align-items: start; }
  .info b { white-space: nowrap; }
  .info .t { font-size: 1.35rem; font-weight: 800; font-style: italic; grid-column: 1 / -1; }
  .missionen { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .mission { min-height: 46px; padding: 0 12px; border: 3px solid #111; border-radius: 10px; background: #fff; font-weight: 800; box-shadow: 3px 3px 0 #111; }
  .mission[aria-pressed="true"] { background: #111; color: #ffd23f; }
  .shop { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; width: 100%; }
  .card { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 12px 10px; border-radius: 12px; border: 4px solid #111; background: #fff; box-shadow: 4px 4px 0 #111; text-align: center; }
  .card .e { font-size: 2.2rem; line-height: 1.1; }
  .card small { color: #444; font-size: .85rem; line-height: 1.3; }
  .card em { font-style: normal; font-weight: 800; font-size: .95rem; margin-top: 3px; }
  .pick { cursor: pointer; flex: 1 1 170px; max-width: 240px; }
  .pick:hover, .pick:focus-visible { background: #fff6c9; transform: translateY(-3px); }
  .pips { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
  .pips i { width: 12px; height: 12px; border-radius: 3px; border: 2px solid #111; background: #fff; }
  .pips i.on { background: #ff3b3b; }
  .neu { color: #e02020; font-weight: 800; }
  .fusion { color: #a020c0; font-weight: 800; }
  .toast { color: #fff; font-weight: 800; min-height: 1.3em; -webkit-text-stroke: 1.5px #111; paint-order: stroke fill; }
  .rang .bar { height: 14px; margin-top: 6px; box-shadow: none; }
  .rang .bar i { background: repeating-linear-gradient(-45deg, #ffd23f 0 8px, #ffb800 8px 16px); }
  .stat { font-size: 1.05rem; line-height: 1.75; }
  .chestBox { font-size: 5rem; animation: wackeln .5s ease-in-out 2; }
  @keyframes wackeln { 25% { transform: rotate(-12deg) scale(1.1); } 75% { transform: rotate(12deg) scale(1.1); } }
  .chestItem { opacity: 0; animation: auf .45s cubic-bezier(.2,1.6,.4,1) forwards; }
  @keyframes auf { from { opacity: 0; transform: scale(.5) rotate(-10deg); } to { opacity: 1; transform: none; } }
  a.zurueck { color: #111; font-weight: 800; text-decoration: none; background: #fff; border: 3px solid #111; border-radius: 8px; padding: 4px 10px; box-shadow: 3px 3px 0 #111; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" hidden>
  <div class="bar"><i id="hpf"></i></div>
  <div class="bar" style="height:12px;margin-top:6px"><i id="xpf"></i></div>
  <div class="hudrow"><span class="chip" id="hLv">LV 1</span><span class="chip" id="hMis"></span><span class="chip" id="hTime"></span><span class="chip" id="hKills">💀 0</span><button id="pauseBtn" aria-label="Pause">II</button></div>
  <button id="ultBtn" aria-label="Ulti auslösen (Leertaste)"><span>ULTI</span></button>
</div>
<div id="banner" class="comic" hidden></div>
<div id="cutin" hidden><div class="band" id="ciBand"><img id="ciImg" alt=""><div class="txt"><b id="ciName"></b><span id="ciUlt"></span></div></div></div>

<div class="screen" id="menu">
  <div class="inner">
    <div><a class="zurueck" href="../">← Spielesammlung</a></div>
    <h1>CODENAME:<br>LINEUP<small>STRENG GEHEIM</small></h1>
    <div class="panel rang">
      <div><b id="rankName"></b> · <span id="rankBonus"></span> · 💰 <b id="coins">0</b></div>
      <div class="bar"><i id="rankBar"></i></div>
    </div>
    <h2>Wähle deinen Agenten</h2>
    <div class="agenten" id="agenten"></div>
    <div class="panel info" id="agentInfo"></div>
    <h2>Mission</h2>
    <div class="missionen" id="missionen"></div>
    <p class="panel" id="missionInfo"></p>
    <div class="row">
      <button class="btn" id="play">▶ EINSATZ!</button>
      <button class="btn alt" id="daily">📅 Tagesmission</button>
    </div>
    <p class="toast" id="toast"></p>
    <p class="panel" id="dailyInfo"></p>
    <h2>Ausrüstung (dauerhaft)</h2>
    <div class="shop" id="shop"></div>
    <div class="row">
      <button class="btn ghost" id="mute"></button>
      <button class="btn ghost" data-sl-cloud>☁️ Spielstand sichern</button>
    </div>
    <p class="panel" id="bestInfo"></p>
  </div>
</div>

<div class="screen" id="lvl" hidden><div class="inner">
  <h2>LEVEL UP! Wähle ein Upgrade</h2>
  <div class="row" id="picks"></div>
  <button class="btn ghost" id="reroll"></button>
</div></div>

<div class="screen" id="chest" hidden><div class="inner">
  <div class="chestBox" aria-hidden="true">💼</div>
  <h2 id="chestTitle"></h2>
  <div class="row" id="chestList"></div>
  <button class="btn" id="chestOk">Weiter</button>
</div></div>

<div class="screen" id="pause" hidden><div class="inner">
  <h2>PAUSE</h2>
  <p class="panel" id="pauseBuild"></p>
  <div class="row"><button class="btn" id="resume">Weiter</button><button class="btn ghost" id="quit">Aufgeben</button></div>
</div></div>

<div class="screen" id="end" hidden><div class="inner">
  <h1 id="endTitle" style="font-size:clamp(2rem,9vw,4rem)"></h1>
  <div class="panel stat" id="endStats"></div>
  <div class="row">
    <button class="btn" id="again">↻ Nochmal</button>
    <button class="btn ghost" id="toMenu">Zentrale &amp; Ausrüstung</button>
  </div>
</div></div>

const $ = id => document.getElementById(id);

const fmt = n => Math.round(n).toLocaleString('de-DE');
