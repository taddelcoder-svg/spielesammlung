<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swimming Lions – Spielesammlung</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦁</text></svg>">
<meta name="robots" content="noindex, nofollow">
<style>
  /* Bricolage Grotesque (SIL OFL 1.1), selbst ausgeliefert statt von Google Fonts */
  @font-face {
    font-family: "Bricolage Grotesque";
    font-weight: 200 800;
    font-display: swap;
    src: url(fonts/bricolage-grotesque.woff2) format("woff2");
  }
  :root {
    --wasser: #7fd6e0;
    --fliese: #f3fbfc;
    --fuge: #c4e6eb;
    --tinte: #13315c;
    --tinte-weich: #3d5a80;
    --leine-rot: #e2463b;
    --leine-gelb: #f6c343;
    --karte: #ffffff;
    /* Design-Tokens */
    --akzent: #13315c;
    --akzent-2: #1c8fa3;
    --erfolg: #1f8a4c;
    --warnung: #b7791f;
    --gefahr: #c2332b;
    --rand: rgba(19,49,92,.14);
    --rand-stark: rgba(19,49,92,.28);
    --glas: rgba(255,255,255,.72);
    --schatten: 0 1px 2px rgba(19,49,92,.08), 0 4px 10px rgba(19,49,92,.06), 0 14px 32px rgba(19,49,92,.08);
    --schatten-hoch: 0 2px 4px rgba(19,49,92,.10), 0 10px 20px rgba(19,49,92,.10), 0 24px 48px rgba(19,49,92,.14);
    --glanz: rgba(255,255,255,.9);
    --radius: 18px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --wasser: #1f6f86;
      --fliese: #0e2a44;
      --fuge: #183b5c;
      --tinte: #eaf6f8;
      --tinte-weich: #a9c4d6;
      --karte: #13345a;
      --akzent: #7fd6e0;
      --akzent-2: #5ec3d3;
      --erfolg: #5fd38d;
      --warnung: #f6c343;
      --gefahr: #ff7b72;
      --rand: rgba(234,246,248,.14);
      --rand-stark: rgba(234,246,248,.30);
      --glas: rgba(19,52,90,.72);
      --schatten: 0 1px 2px rgba(0,0,0,.30), 0 4px 10px rgba(0,0,0,.22), 0 14px 32px rgba(0,0,0,.28);
      --schatten-hoch: 0 2px 4px rgba(0,0,0,.35), 0 10px 20px rgba(0,0,0,.30), 0 24px 48px rgba(0,0,0,.40);
      --glanz: rgba(255,255,255,.08);
    }
  }
  :root[data-theme="dark"] {
    --wasser: #1f6f86;
    --fliese: #0e2a44;
    --fuge: #183b5c;
    --tinte: #eaf6f8;
    --tinte-weich: #a9c4d6;
    --karte: #13345a;
    --akzent: #7fd6e0;
    --akzent-2: #5ec3d3;
    --erfolg: #5fd38d;
    --warnung: #f6c343;
    --gefahr: #ff7b72;
    --rand: rgba(234,246,248,.14);
    --rand-stark: rgba(234,246,248,.30);
    --glas: rgba(19,52,90,.72);
    --schatten: 0 1px 2px rgba(0,0,0,.30), 0 4px 10px rgba(0,0,0,.22), 0 14px 32px rgba(0,0,0,.28);
    --schatten-hoch: 0 2px 4px rgba(0,0,0,.35), 0 10px 20px rgba(0,0,0,.30), 0 24px 48px rgba(0,0,0,.40);
    --glanz: rgba(255,255,255,.08);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--tinte);
    background-color: var(--fliese);
    /* Wasserlicht oben + Schwimmbad-Fliesen */
    background-image:
      radial-gradient(900px 420px at 15% -80px, color-mix(in srgb, var(--wasser) 45%, transparent), transparent 70%),
      linear-gradient(var(--fuge) 1.5px, transparent 1.5px),
      linear-gradient(90deg, var(--fuge) 1.5px, transparent 1.5px);
    background-size: auto, 44px 44px, 44px 44px;
    background-repeat: no-repeat, repeat, repeat;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  img { max-width: 100%; }

  .wrap {
    max-width: 1080px; margin: 0 auto;
    padding: 0 max(20px, env(safe-area-inset-right, 0px)) 0 max(20px, env(safe-area-inset-left, 0px));
  }

  /* Kopfbereich */
  header { padding: 48px 0 24px; animation: rein .35s ease both; }
  .studio {
    display: inline-flex; align-items: center; gap: 8px;
    font-weight: 700; font-size: .95rem; color: var(--tinte-weich);
    padding: 6px 14px 6px 10px; border-radius: 99px;
    background: var(--glas); border: 1px solid var(--rand);
    box-shadow: var(--schatten);
  }
  .studio span { font-size: 1.3rem; line-height: 1; }
  h1 {
    margin: 18px 0 0;
    font-size: clamp(2.8rem, 9vw, 6.2rem);
    font-weight: 800;
    line-height: .92;
    letter-spacing: -0.035em;
    background: linear-gradient(100deg, var(--tinte) 35%, var(--akzent-2) 140%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: var(--tinte);
    padding-bottom: .06em;
  }
  .intro {
    max-width: 52ch;
    font-size: 1.15rem;
    line-height: 1.5;
    color: var(--tinte-weich);
    margin: 16px 0 0;
  }
  .anzahl {
    display: inline-flex; align-items: center; gap: 8px;
    margin: 20px 0 0; padding: 6px 14px; min-height: 32px;
    border-radius: 99px; font-weight: 700; font-size: .92rem;
    background: var(--glas); border: 1px solid var(--rand);
    color: var(--tinte); font-variant-numeric: tabular-nums;
  }
  .anzahl::before {
    content: ""; width: 8px; height: 8px; border-radius: 50%;
    background: var(--erfolg); box-shadow: 0 0 0 3px color-mix(in srgb, var(--erfolg) 25%, transparent);
  }

  /* Bahnleine als Trenner */
  .leine {
    height: 12px;
    margin: 28px 0 32px;
    border-radius: 6px;
    background: repeating-linear-gradient(90deg,
      var(--leine-rot) 0 26px,
      #ffffff 26px 34px,
      var(--leine-gelb) 34px 60px,
      #ffffff 60px 68px);
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.15), 0 2px 6px rgba(19,49,92,.15);
  }

  /* Spielegitter */
  .gitter {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
    padding-bottom: 64px;
  }
  .spiel {
    position: relative;
    display: flex; flex-direction: column;
    background: var(--karte);
    border: 1px solid var(--rand);
    border-radius: var(--radius);
    padding: 20px;
    text-decoration: none;
    color: inherit;
    box-shadow: var(--schatten);
    overflow: hidden;
    isolation: isolate;
    transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    animation: rein .4s ease both;
    animation-delay: calc(var(--i, 0) * 35ms + 80ms);
  }
  /* Farbiger Schimmer aus der Spielfarbe */
  .spiel::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 110px; z-index: -1;
    background: linear-gradient(180deg, color-mix(in srgb, var(--farbe, var(--wasser)) 26%, transparent), transparent);
    opacity: .9;
  }
  .spiel::after {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 4px; z-index: 0;
    background: var(--farbe, var(--wasser));
  }
  a.spiel:hover {
    transform: translateY(-4px);
    box-shadow: var(--schatten-hoch);
    border-color: color-mix(in srgb, var(--farbe, var(--wasser)) 60%, var(--rand-stark));
  }
  a.spiel:active { transform: translateY(-1px) scale(.99); box-shadow: var(--schatten); }
  a.spiel:focus-visible { outline: 3px solid var(--akzent); outline-offset: 3px; }

  .icon {
    width: 76px; height: 76px;
    display: grid; place-items: center;
    border-radius: 20px;
    background:
      linear-gradient(145deg, rgba(255,255,255,.35), rgba(255,255,255,0) 55%),
      var(--farbe, var(--wasser));
    font-size: 2.6rem;
    overflow: hidden;
    border: 1px solid rgba(0,0,0,.12);
    box-shadow: 0 6px 14px color-mix(in srgb, var(--farbe, var(--wasser)) 40%, transparent), inset 0 1px 0 rgba(255,255,255,.5);
    transition: transform .25s ease;
  }
  a.spiel:hover .icon { transform: rotate(-4deg) scale(1.05); }
  .icon img { width: 100%; height: 100%; object-fit: cover; }

  .spiel h2 { margin: 16px 0 6px; font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em; }
  .spiel p { margin: 0; line-height: 1.45; color: var(--tinte-weich); flex: 1; }

  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 18px; }
  .tag {
    font-size: .8rem; font-weight: 600;
    padding: 3px 10px; border-radius: 99px;
    background: var(--fliese); border: 1px solid var(--rand);
    color: var(--tinte);
  }
  .knopf {
    align-self: flex-start;
    display: inline-flex; align-items: center; gap: 8px;
    min-height: 44px;
    font-weight: 800; font-size: 1.02rem;
    padding: 0 18px 0 20px; border-radius: 12px;
    background: var(--tinte); color: var(--karte);
    box-shadow: 0 2px 6px rgba(19,49,92,.25);
    transition: background .2s ease, gap .2s ease;
  }
  .knopf svg { width: 16px; height: 16px; flex: none; transition: transform .2s ease; }
  a.spiel:hover .knopf { background: var(--akzent-2); color: #fff; }
  a.spiel:hover .knopf svg { transform: translateX(3px); }
  .spiel.bald { box-shadow: none; border-style: dashed; border-color: var(--rand-stark); background: transparent; }
  .spiel.bald .knopf { background: transparent; color: var(--tinte-weich); border: 1.5px dashed var(--tinte-weich); box-shadow: none; }

  /* Update-Fenster */
  .updates {
    position: relative;
    background: var(--karte);
    border: 1px solid var(--rand);
    border-radius: var(--radius);
    padding: 18px 22px 12px;
    margin: 0 0 28px;
    box-shadow: var(--schatten);
    overflow: hidden;
    animation: rein .4s ease both; animation-delay: 40ms;
  }
  .updates::before {
    content: ""; position: absolute; inset: 0 auto 0 0; width: 5px;
    background: linear-gradient(180deg, var(--leine-gelb), var(--leine-rot));
  }
  .updates h2 {
    display: flex; align-items: center; gap: 8px;
    margin: 0 0 6px; font-size: 1.2rem; font-weight: 800; letter-spacing: -0.01em;
  }
  .updates ul { list-style: none; margin: 0; padding: 0; }
  .updates li {
    display: flex; gap: 14px; padding: 10px 0; line-height: 1.4;
    border-top: 1px solid var(--rand);
  }
  .updates li:first-child { border-top: 0; }
  .updates time {
    flex: none; align-self: flex-start;
    font-weight: 700; font-size: .85rem; color: var(--tinte-weich);
    font-variant-numeric: tabular-nums;
    padding: 2px 10px; border-radius: 99px;
    background: var(--fliese); border: 1px solid var(--rand);
    margin-top: 1px;
  }
  .updates li.neu time { background: var(--leine-gelb); border-color: transparent; color: #13315c; }
  .updates li.neu time::after { content: " · neu"; font-weight: 800; }

  /* Ranglisten */
  .rang-knopf {
    display: inline-flex; align-items: center; gap: 8px; margin: 20px 0 0 8px;
    min-height: 44px; padding: 0 18px; border-radius: 12px; border: 0; cursor: pointer;
    font: inherit; font-weight: 800; font-size: 1rem;
    background: var(--leine-gelb); color: #13315c; box-shadow: 0 2px 6px rgba(19,49,92,.25);
  }
  .rang-knopf:focus-visible, .rang-tab:focus-visible, .rang-zu:focus-visible { outline: 3px solid var(--akzent); outline-offset: 3px; }
  dialog.rang {
    width: min(720px, calc(100vw - 24px)); max-height: calc(100vh - 24px);
    padding: 0; border: 1px solid var(--rand); border-radius: var(--radius);
    background: var(--karte); color: var(--tinte); box-shadow: var(--schatten-hoch);
  }
  dialog.rang::backdrop { background: rgba(10,25,45,.55); }
  .rang-kopf { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--rand); }
  .rang-kopf h2 { margin: 0; font-size: 1.3rem; font-weight: 800; }
  .rang-zu { min-width: 44px; min-height: 44px; border: 1px solid var(--rand); border-radius: 12px; background: var(--fliese); color: var(--tinte); font: inherit; font-size: 1.2rem; cursor: pointer; }
  .rang-inhalt { padding: 16px 20px 20px; overflow: auto; max-height: calc(100vh - 110px); }
  .rang-zeile { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 14px; }
  .rang-zeile select, .rang-zeile input {
    min-height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--rand-stark);
    background: var(--fliese); color: var(--tinte); font: inherit;
  }
  .rang-zeile input { width: 7.5em; }
  .rang-tab {
    min-height: 44px; padding: 0 14px; border-radius: 99px; border: 1px solid var(--rand);
    background: var(--fliese); color: var(--tinte); font: inherit; font-weight: 700; cursor: pointer;
  }
  .rang-tab[aria-pressed="true"] { background: var(--tinte); color: var(--karte); }
  table.rang-tabelle { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  .rang-tabelle th, .rang-tabelle td { padding: 10px 8px; text-align: left; border-top: 1px solid var(--rand); }
  .rang-tabelle th { font-size: .8rem; color: var(--tinte-weich); border-top: 0; }
  .rang-tabelle td.platz { font-weight: 800; width: 3em; }
  .rang-tabelle tr.ich td { background: color-mix(in srgb, var(--leine-gelb) 22%, transparent); }
  .rang-leer, .rang-hinweis { color: var(--tinte-weich); line-height: 1.45; margin: 8px 0 0; font-size: .92rem; }
  .balken { display: inline-block; width: 70px; height: 8px; border-radius: 4px; background: var(--fuge); vertical-align: middle; overflow: hidden; margin-right: 6px; }
  .balken i { display: block; height: 100%; background: var(--erfolg); }

  footer { padding: 0 0 40px; color: var(--tinte-weich); font-size: .95rem; }
  footer a { color: inherit; text-underline-offset: 3px; border-radius: 4px; }
  footer a:hover { color: var(--tinte); }
  footer a:focus-visible { outline: 3px solid var(--akzent); outline-offset: 3px; }

  @keyframes rein {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: none; }
  }

  @media (max-width: 520px) {
    header { padding-top: 32px; }
    .updates { padding: 16px 16px 8px 20px; }
    .updates li { flex-direction: column; gap: 4px; }
    .gitter { gap: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    a.spiel:hover, a.spiel:active { transform: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="studio"><span aria-hidden="true">🦁</span> Swimming Lions</div>
      <h1>Spielesammlung</h1>
      <p class="intro">Alle unsere Browserspiele an einem Ort. Such dir eins aus und spring rein.</p>
      <div class="anzahl" id="anzahl" hidden></div>
      <button type="button" class="rang-knopf" id="rangOeffnen"><span aria-hidden="true">🏆</span> Ranglisten</button>
    </header>

    <div class="leine" role="presentation"></div>

    <section class="updates" aria-labelledby="updatesTitel">
      <h2 id="updatesTitel">🆕 Updates</h2>
      <ul id="updates"></ul>
    </section>

    <main class="gitter" id="gitter" aria-label="Spiele"></main>

    <footer>© <span id="jahr"></span> Swimming Lions · Privates Hobbyprojekt · <a href="datenschutz.html">Datenschutz</a></footer>
  </div>

  <dialog class="rang" id="rangDialog" aria-labelledby="rangTitel">
    <div class="rang-kopf">
      <h2 id="rangTitel">🏆 Ranglisten</h2>
      <button type="button" class="rang-zu" id="rangZu" aria-label="Schließen">✕</button>
    </div>
    <div class="rang-inhalt">
      <div class="rang-zeile">
        <label for="rangSpieler">Ich bin:</label>
        <select id="rangSpieler" aria-label="Spieler wählen"></select>
        <input id="rangNeu" type="text" maxlength="16" placeholder="Neuer Name" aria-label="Neuer Spielername">
        <button type="button" class="rang-tab" id="rangNeuOk">Hinzufügen</button>
      </div>
      <div class="rang-zeile" id="rangTabs" role="group" aria-label="Rangliste wählen"></div>
      <div id="rangAnzeige"></div>
    </div>
  </dialog>

/* ---------- ab hier nichts ändern ---------- */
const gitter = document.getElementById("gitter");

function istBild(icon) {
  return /\.(png|jpe?g|webp|gif|svg)$/i.test(icon) || icon.startsWith("data:") || icon.startsWith("http");
}

function escape(text) {
  const d = document.createElement("div");
  d.textContent = text;
  return d.innerHTML;
}

const PFEIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

SPIELE.forEach((spiel, i) => {
  const hatLink = spiel.link && spiel.link.trim() !== "";
  const el = document.createElement(hatLink ? "a" : "div");
  el.className = "spiel" + (hatLink ? "" : " bald");
  el.style.setProperty("--i", Math.min(i, 12));
  if (spiel.farbe) el.style.setProperty("--farbe", spiel.farbe);

  if (hatLink) {
    el.href = spiel.link;
    if (spiel.neuerTab) { el.target = "_blank"; el.rel = "noopener"; }
  }

  const iconInhalt = istBild(spiel.icon)
    ? `<img src="${escape(spiel.icon)}" alt="">`
    : `<span aria-hidden="true">${escape(spiel.icon)}</span>`;

  el.innerHTML = `
    <div class="icon" style="--farbe:${escape(spiel.farbe || "")}">${iconInhalt}</div>
    <h2>${escape(spiel.name)}</h2>
    <p>${escape(spiel.beschreibung)}</p>
    <div class="tags">${(spiel.tags || []).map(t => `<span class="tag">${escape(t)}</span>`).join("")}</div>
    <span class="knopf">${hatLink ? "Spielen" + PFEIL : "Bald verfügbar"}</span>
  `;
  gitter.appendChild(el);
});

const updateListe = document.getElementById("updates");
UPDATES.slice(0, 5).forEach((u, i) => {
  const li = document.createElement("li");
  if (i === 0) li.className = "neu";
  li.innerHTML = `<time>${escape(u.datum)}</time><span>${escape(u.text)}</span>`;
  updateListe.appendChild(li);
});

const anzahlEl = document.getElementById("anzahl");
const anzahlSpiele = SPIELE.filter(sp => sp.link && sp.link.trim() !== "").length;
anzahlEl.textContent = anzahlSpiele + (anzahlSpiele === 1 ? " Spiel" : " Spiele") + " zum Losspielen";

<script>
/* =========================================================
   RANGLISTEN – live vom Rangliste-Dienst (rangliste-server/)
   Die Spiele melden Spielzeit, Punkte und Progress selbst (melder.js).
   Die Sammlung zeigt nur an und gibt beim Start den Namen mit.
   ========================================================= */
const RANG_API = "https://rangliste-aoee.onrender.com";   // Adresse des Rangliste-Dienstes, z. B. "https://rangliste-sl.onrender.com"
(function(){
  var KEY = 'sl_name', AKTUALISIEREN_MS = 15000;
  var daten = { spieler: [], werte: {} }, name = '', ansicht = 'Gesamt', timer = null;
  try { name = localStorage.getItem(KEY) || ''; } catch (e) {}
  var dlg = document.getElementById('rangDialog'), anzeige = document.getElementById('rangAnzeige'),
      tabs = document.getElementById('rangTabs'), wahl = document.getElementById('rangSpieler'),
      knopf = document.getElementById('rangOeffnen');
  var spieleNamen = SPIELE.filter(function(s){ return s.link && s.link.trim(); }).map(function(s){ return s.name; });

  if (!RANG_API) { knopf.hidden = true; return; }

  // Beim Start eines Spiels den Namen mitgeben, damit das Spiel weiß, wer spielt
  document.getElementById('gitter').addEventListener('click', function(e){
    var a = e.target.closest && e.target.closest('a.spiel');
    if (!a || !name) return;
    try { var u = new URL(a.href); u.searchParams.set('sl', name); a.href = u.toString(); } catch (f) {}
  }, true);

  var fmt = function(n){ return Number(n).toLocaleString('de-DE'); };
  function zeitText(sek){
    sek = Math.round(sek || 0);
    if (sek < 60) return sek + ' s';
    var m = Math.floor(sek / 60), h = Math.floor(m / 60);
    return h ? h + ' h ' + (m % 60) + ' min' : m + ' min';
  }
  function el(tag, text, klasse){ var e = document.createElement(tag); if (text !== undefined) e.textContent = text; if (klasse) e.className = klasse; return e; }
  function zelle(tr, text, klasse){ var td = el('td', text, klasse); tr.appendChild(td); return td; }
  function kopf(spalten){ var t = el('table', undefined, 'rang-tabelle'), tr = document.createElement('tr'); spalten.forEach(function(s){ tr.appendChild(el('th', s)); }); var h = document.createElement('thead'); h.appendChild(tr); t.appendChild(h); return t; }
  function balken(proz){
    var w = el('span'), b = el('span', undefined, 'balken'), i = document.createElement('i');
    i.style.width = Math.max(0, Math.min(100, proz)) + '%'; b.appendChild(i); w.appendChild(b); w.appendChild(document.createTextNode(Math.round(proz) + ' %'));
    return w;
  }
  var zeitVon = function(e){ return (e.zeit || 0) + (e.zeitAlt || 0); };

  function laden(){
    return fetch(RANG_API + '/api/rangliste', { cache: 'no-store' }).then(function(r){ return r.json(); }).then(function(j){
      daten = { spieler: j.spieler || [], werte: j.werte || {} }; anzeigeFehler = false;
    }).catch(function(){ anzeigeFehler = true; });
  }
  var anzeigeFehler = false;

  function spielerListe(){
    wahl.textContent = '';
    var o0 = el('option', name ? 'Ich bin …' : 'Name wählen …'); o0.value = ''; wahl.appendChild(o0);
    daten.spieler.slice().sort().forEach(function(n){ var o = el('option', n); o.value = n; if (n === name) o.selected = true; wahl.appendChild(o); });
  }
  function tabsBauen(){
    tabs.textContent = '';
    var b = el('button', '🏆 Gesamt', 'rang-tab'); b.type = 'button'; b.setAttribute('aria-pressed', ansicht === 'Gesamt');
    b.onclick = function(){ ansicht = 'Gesamt'; zeigen(); };
    tabs.appendChild(b);
    var s = document.createElement('select'); s.setAttribute('aria-label', 'Spiel wählen');
    var o0 = el('option', 'Einzelnes Spiel …'); o0.value = ''; s.appendChild(o0);
    spieleNamen.forEach(function(n){ var o = el('option', n); o.value = n; if (n === ansicht) o.selected = true; s.appendChild(o); });
    s.onchange = function(){ ansicht = s.value || 'Gesamt'; zeigen(); };
    tabs.appendChild(s);
  }

  function gesamt(){
    var rp = {}, zeit = {}, prog = {};
    daten.spieler.forEach(function(n){ rp[n] = 0; zeit[n] = 0; prog[n] = []; });
    spieleNamen.forEach(function(sp){
      var s = daten.werte[sp] || {};
      var mit = daten.spieler.filter(function(n){ return s[n] && s[n].punkte > 0; }).sort(function(a, b){ return s[b].punkte - s[a].punkte; });
      mit.forEach(function(n, i){ rp[n] += mit.length - i; });
      daten.spieler.forEach(function(n){ if (s[n]) { zeit[n] += zeitVon(s[n]); if (s[n].progress > 0) prog[n].push(s[n].progress); } });
    });
    return daten.spieler.map(function(n){
      var p = prog[n];
      return { name: n, rp: rp[n], zeit: zeit[n], progress: p.length ? p.reduce(function(a, b){ return a + b; }, 0) / p.length : 0 };
    }).sort(function(a, b){ return b.rp - a.rp || b.zeit - a.zeit; });
  }

  function zeigen(){
    tabsBauen(); spielerListe(); anzeige.textContent = '';
    if (anzeigeFehler) anzeige.appendChild(el('p', 'Die Rangliste ist gerade nicht erreichbar. Beim ersten Aufruf nach einer Pause kann der Server ein paar Sekunden zum Aufwachen brauchen.', 'rang-hinweis'));
    if (!daten.spieler.length) { if (!anzeigeFehler) anzeige.appendChild(el('p', 'Noch niemand dabei. Lege oben einen Namen an und spiel ein Spiel, dann taucht dein Name hier auf.', 'rang-leer')); return; }
    if (ansicht === 'Gesamt') {
      var t = kopf(['Platz', 'Spieler', 'Rangpunkte', 'Spielzeit', 'Ø Progress']);
      gesamt().forEach(function(z, i){
        var tr = document.createElement('tr'); if (z.name === name) tr.className = 'ich';
        zelle(tr, i + 1, 'platz'); zelle(tr, z.name); zelle(tr, z.rp); zelle(tr, zeitText(z.zeit)); zelle(tr, '').appendChild(balken(z.progress));
        t.appendChild(tr);
      });
      anzeige.appendChild(t);
      anzeige.appendChild(el('p', 'Rangpunkte: In jedem Spiel bekommt der Beste so viele Punkte wie Mitspieler mit einem Ergebnis, der Zweite einen weniger usw. Die Werte kommen direkt aus den Spielen und aktualisieren sich alle paar Sekunden.', 'rang-hinweis'));
      return;
    }
    var s = daten.werte[ansicht] || {};
    var zeilen = daten.spieler.filter(function(n){ return s[n]; }).map(function(n){ var e = s[n]; return { name: n, punkte: e.punkte || 0, progress: e.progress || 0, zeit: zeitVon(e) }; })
      .sort(function(a, b){ return b.punkte - a.punkte || b.zeit - a.zeit; });
    if (!zeilen.length) { anzeige.appendChild(el('p', 'In ' + ansicht + ' hat noch niemand etwas gemeldet.', 'rang-leer')); return; }
    var tab = kopf(['Platz', 'Spieler', 'Punkte', 'Spielzeit', 'Progress']);
    zeilen.forEach(function(z, i){
      var tr = document.createElement('tr'); if (z.name === name) tr.className = 'ich';
      zelle(tr, i + 1, 'platz'); zelle(tr, z.name); zelle(tr, fmt(z.punkte)); zelle(tr, zeitText(z.zeit)); zelle(tr, '').appendChild(balken(z.progress));
      tab.appendChild(tr);
    });
    anzeige.appendChild(tab);
  }

  function nameSetzen(n){
    name = n; try { localStorage.setItem(KEY, n); } catch (e) {}
    zeigen();
  }
  document.getElementById('rangNeuOk').onclick = function(){
    var i = document.getElementById('rangNeu'), n = i.value.trim().slice(0, 16);
    if (n.length < 2) return;
    fetch(RANG_API + '/api/spieler', { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ name: n }) })
      .then(function(r){ return r.json(); }).then(function(j){ if (j.ok) { i.value = ''; return laden().then(function(){ nameSetzen(j.name); }); } });
  };
  wahl.onchange = function(){ if (wahl.value) nameSetzen(wahl.value); };
  knopf.onclick = function(){
    dlg.showModal(); zeigen();
    laden().then(zeigen);
    timer = setInterval(function(){ laden().then(zeigen); }, AKTUALISIEREN_MS);
  };
  function zu(){ clearInterval(timer); }
  dlg.addEventListener('close', zu);
  document.getElementById('rangZu').onclick = function(){ dlg.close(); };
  dlg.addEventListener('click', function(e){ if (e.target === dlg) dlg.close(); });
})();
</script>
<script>
// Goodnotes-Knopf – in allen Spielen gleich (Vorlage: spielesammlung).
// Kleiner, halbtransparenter Knopf nur auf iPad/iPhone/Mac, öffnet die Goodnotes-App.
// Verschieben: Knopf ziehen (Platz wird gemerkt). Tastenkürzel: Ctrl+Shift+G oder Alt+G.
(function(){
  var ua = navigator.userAgent;
  var apple = /iPad|iPhone|iPod/.test(ua) || /Macintosh/.test(ua);
  if (!apple) return;
  var ZIEL = 'goodnotes://';
  function oeffnen(){
    try { window.top.location.href = ZIEL; } catch (e) { location.href = ZIEL; }
  }
  document.addEventListener('keydown', function(e){
    if (e.code === 'KeyG' && ((e.ctrlKey && e.shiftKey) || (e.altKey && !e.ctrlKey && !e.metaKey))){
      e.preventDefault(); e.stopPropagation(); oeffnen();
    }
  }, true);
  if ((navigator.maxTouchPoints || 0) < 1) return;   // Knopf nur auf Touch-Geräten
  function bauen(){
    var k = document.createElement('div');
    k.setAttribute('role', 'button');
    k.setAttribute('aria-label', 'Goodnotes öffnen');
    k.title = 'Goodnotes öffnen';
    k.innerHTML = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
    k.style.cssText = 'position:fixed;z-index:2147483647;width:32px;height:32px;border-radius:50%;'
      + 'display:flex;align-items:center;justify-content:center;background:rgba(20,20,30,.55);color:#fff;'
      + 'opacity:.3;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;'
      + 'transition:opacity .2s;cursor:pointer;-webkit-tap-highlight-color:transparent';
    var pos = null;
    try { pos = JSON.parse(localStorage.getItem('goodnotes_knopf')); } catch (e) {}
    function setzen(x, y){
      x = Math.max(0, Math.min(innerWidth - 32, x)); y = Math.max(0, Math.min(innerHeight - 32, y));
      k.style.left = x + 'px'; k.style.top = y + 'px';
    }
    function platzieren(){
      if (pos) setzen(pos.x * innerWidth, pos.y * innerHeight);
      else { k.style.left = 'calc(env(safe-area-inset-left) + 6px)'; k.style.top = 'calc(50% - 16px)'; }
    }
    platzieren();
    addEventListener('resize', platzieren);
    var start = null, gezogen = false;
    function stopp(e){ e.stopPropagation(); }
    k.addEventListener('touchstart', stopp, { passive:true });
    k.addEventListener('touchmove', function(e){ e.stopPropagation(); if (e.cancelable) e.preventDefault(); }, { passive:false });
    k.addEventListener('touchend', function(e){ e.stopPropagation(); if (e.cancelable) e.preventDefault(); }, { passive:false });
    k.addEventListener('pointerdown', function(e){
      e.stopPropagation(); e.preventDefault();
      var r = k.getBoundingClientRect();
      start = { x:e.clientX, y:e.clientY, dx:e.clientX - r.left, dy:e.clientY - r.top }; gezogen = false;
      k.style.opacity = '.9';
      try { k.setPointerCapture(e.pointerId); } catch (f) {}
    });
    k.addEventListener('pointermove', function(e){
      if (!start) return;
      e.stopPropagation();
      if (!gezogen && Math.abs(e.clientX - start.x) + Math.abs(e.clientY - start.y) < 10) return;
      gezogen = true;
      setzen(e.clientX - start.dx, e.clientY - start.dy);
    });
    function ende(e){
      if (!start) return;
      e.stopPropagation(); start = null; k.style.opacity = '.3';
      if (gezogen){
        var r = k.getBoundingClientRect();
        pos = { x:r.left / innerWidth, y:r.top / innerHeight };
        try { localStorage.setItem('goodnotes_knopf', JSON.stringify(pos)); } catch (f) {}
      } else if (e.type === 'pointerup') oeffnen();
    }
    k.addEventListener('pointerup', ende);
    k.addEventListener('pointercancel', ende);
    k.addEventListener('click', stopp);
    k.addEventListener('contextmenu', function(e){ e.preventDefault(); });
    document.body.appendChild(k);
  }
  if (document.body) bauen(); else document.addEventListener('DOMContentLoaded', bauen);
})();
</script>
